{% extends "base.html" %}
{% block title %}Not linked · Dynasty Commish{% endblock %}
{% block content %}
<div class="card">
  <h1>Your Discord account isn't linked to a team</h1>
  <p>Send this to the commissioner so they can link you:</p>
  <p><strong>{{ discord_username }}</strong> <span class="muted">(Discord ID {{ discord_id }})</span></p>
  <p><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
