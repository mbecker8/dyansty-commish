# Render Blueprint. Free tier for M1; switch plans to paid (starter web +
# basic Postgres with backups) before the league beta. Free Postgres expires.
services:
  - type: web
    name: dynasty-commish
    runtime: python
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: uv run --frozen --no-dev gunicorn config.wsgi:application
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dynasty-commish-db
          property: connectionString
      # Sign in with Discord: set in the dashboard (never committed). The Discord app's
      # OAuth2 redirect must include https://<render host>/auth/discord/callback.
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

databases:
  - name: dynasty-commish-db
    plan: free
    databaseName: dynasty_commish
