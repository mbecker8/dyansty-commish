# Render Blueprint. Paid plans: a starter web instance (the Shell needs one, and it
# doesn't sleep) and basic Postgres, which has daily backups and doesn't expire.
services:
  - type: web
    name: dynasty-commish
    runtime: python
    plan: starter
    buildCommand: ./bin/render-build.sh
    startCommand: uv run --frozen --no-dev gunicorn config.wsgi:application --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dynasty-commish-db
          property: connectionString
      # Sign in with Discord: set in the dashboard (never committed). The Discord app's
      # OAuth2 redirect must include https://<render host>/auth/discord/callback.
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # Fantrax (read-only): the commissioner's browser Cookie header, and the Secret ID from
      # the Fantrax user profile (only used to find the renewed league). Set in the dashboard.
      - key: FANTRAX_COOKIE
        sync: false
      - key: FANTRAX_SECRET_ID
        sync: false

databases:
  - name: dynasty-commish-db
    plan: basic-256mb
    databaseName: dynasty_commish
